<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>María Durán - Panel de Control Agenda</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Georgia', 'Helvetica Neue', sans-serif; }
    body { background-color: #F6F3ED; color: #0B1E36; margin: 0; padding: 20px 12px; display: flex; justify-content: center; }
    .admin-container { max-width: 800px; width: 100%; background: #FFFFFF; border-radius: 16px; padding: 20px; border: 1px solid #E2DBCF; box-shadow: 0 4px 15px rgba(11, 30, 54, 0.08); }
    .header { text-align: center; border-bottom: 2px solid #F6F3ED; padding-bottom: 12px; margin-bottom: 20px; }
    .logo-title { font-size: 20px; font-weight: bold; letter-spacing: 3px; color: #0B1E36; margin: 0; }
    .logo-subtitle { font-size: 10px; color: #B89047; letter-spacing: 4px; margin-top: 4px; font-weight: bold; }
    .badge-admin { background: #0B1E36; color: #FFFFFF; font-size: 10px; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-top: 6px; }
    
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background-color: #0B1E36; color: #FFFFFF; }
    .btn-gold { background-color: #B89047; color: #FFFFFF; }
    
    /* Chips de Estado */
    .chip { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
    .chip-pagado { background-color: #E6F4EA; color: #137333; border: 1px solid #1e8e3e; }
    .chip-bono { background-color: #F3E8FD; color: #681DA8; border: 1px solid #9333EA; }
    .chip-pendiente { background-color: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }

    /* Lista de Citas */
    .cita-card { background: #FCFBF9; border: 1px solid #E2DBCF; border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .cita-info { flex: 1; min-width: 200px; }
    .cita-cliente { font-size: 16px; font-weight: bold; color: #0B1E36; }
    .cita-detalles { font-size: 13px; color: #555; font-family: sans-serif; margin-top: 4px; }
    .cita-nota { font-size: 11px; color: #B89047; font-style: italic; margin-top: 4px; font-family: sans-serif; }
    .cita-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    select.status-select { padding: 6px; border-radius: 6px; border: 1px solid #D1C7B7; font-size: 12px; font-family: sans-serif; background: #FFF; }
    .btn-ws { background-color: #25D366; color: #FFF; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; font-family: sans-serif; }

    /* Formulario Nueva Cita Manual */
    .manual-form { background: #FFFDF9; border: 1px dashed #B89047; padding: 16px; border-radius: 10px; margin-bottom: 20px; display: none; }
    input, select { width: 100%; padding: 8px; border: 1px solid #D1C7B7; border-radius: 6px; margin-bottom: 10px; font-size: 13px; font-family: sans-serif; }
    label { font-size: 11px; font-weight: bold; font-family: sans-serif; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="header">
    <div class="logo-title">MARÍA DURÁN</div>
    <div class="logo-subtitle">— QUIROMASAJISTA —</div>
    <div class="badge-admin">Panel de Gestión (iPad / Móvil)</div>
  </div>

  <div class="toolbar">
    <button class="btn btn-gold" onclick="toggleManualForm()">✚ Añadir Cita Manual</button>
    <button class="btn btn-primary" onclick="cargarCitas()">🔄 Actualizar Lista</button>
  </div>

  <!-- Formulario Cita Manual -->
  <div class="manual-form" id="manual-form">
    <strong style="display:block; margin-bottom:10px; font-family:sans-serif;">Nueva Cita Manual / Presencial</strong>
    <form id="form-cita-manual">
      <label>Nombre del Cliente:</label>
      <input type="text" id="m_nombre" required placeholder="Ej. Emanuel">
      
      <label>Teléfono WhatsApp:</label>
      <input type="tel" id="m_telefono" required placeholder="Ej. 600123456">

      <label>Servicio:</label>
      <select id="m_servicio">
        <option value="1">Quiromasaje Descontracturante (35 €)</option>
        <option value="2">Sesión de Bono de Masajes (BONO)</option>
      </select>

      <label>Fecha:</label>
      <input type="date" id="m_fecha" required>

      <label>Hora:</label>
      <input type="time" id="m_hora" required value="10:00">

      <label>Notas o Dolencia:</label>
      <input type="text" id="m_nota" placeholder="Ej. Espalda recargada">

      <button type="submit" class="btn btn-primary">Guardar Cita</button>
      <button type="button" class="btn" style="background:#ccc; color:#333;" onclick="toggleManualForm()">Cancelar</button>
    </form>
  </div>

  <!-- Lista de Citas Reservadas -->
  <div id="lista-citas">
    <div style="text-align:center; padding:20px; font-family:sans-serif; color:#777;">Cargando agenda...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://fuykfpyobiweyoihzsbx.supabase.co";
  
  // ¡IMPORTANTE! Pega tu clave larga 'anon public' dentro de las comillas
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1eWtmcHlvYml3ZXlvaWh6c2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODM3NDcsImV4cCI6MjEwMTM1OTc0N30.UT4aMQU5wJf2rKZpbEXE5YG3qjV_il8OXBlcm5lKz2A"; 

  function toggleManualForm() {
    const form = document.getElementById('manual-form');
    form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  async function cargarCitas() {
    const contenedor = document.getElementById('lista-citas');
    contenedor.innerHTML = '<div style="text-align:center; padding:20px; font-family:sans-serif; color:#777;">Cargando agenda...</div>';

    if (SUPABASE_KEY === "TU_CLAVE_ANON_PUBLIC_AQUI" || !SUPABASE_KEY) {
      contenedor.innerHTML = '<div style="color:red; text-align:center; padding:20px; font-family:sans-serif;"><b>⚠️ Atención:</b> Falta pegar tu clave <code>anon public</code> de Supabase en la línea 99 del código de <code>admin.html</code>.</div>';
      return;
    }

    try {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const { data: citas, error } = await supabase
        .from('citas')
        .select('*')
        .order('fecha', { ascending: true });

      if (error) {
        contenedor.innerHTML = `<div style="color:red; text-align:center; padding:20px; font-family:sans-serif;">Error al cargar datos: ${error.message}</div>`;
        return;
      }

      if (!citas || citas.length === 0) {
        contenedor.innerHTML = '<div style="text-align:center; padding:20px; font-family:sans-serif; color:#777;">No hay citas registradas en la agenda.</div>';
        return;
      }

      let html = '';
      citas.forEach(cita => {
        const servicioNombre = cita.servicio_id === 2 ? 'Sesión de Bono de Masajes' : 'Quiromasaje Descontracturante';
        const estadoClass = cita.estado === 'pagado' ? 'chip-pagado' : (cita.estado === 'bono' ? 'chip-bono' : 'chip-pendiente');
        const estadoTexto = cita.estado ? cita.estado.toUpperCase() : 'PENDIENTE';

        const msjWhatsApp = encodeURIComponent(`Hola ${cita.cliente_nombre}, te escribo desde la clínica de María Durán para recordarte tu cita el día ${cita.fecha} a las ${cita.hora} h. ¡Te esperamos!`);
        const linkWhatsApp = `https://wa.me/${cita.cliente_telefono.replace(/\s+/g, '')}?text=${msjWhatsApp}`;

        html += `
          <div class="cita-card">
            <div class="cita-info">
              <div class="cita-cliente">${cita.cliente_nombre} <span class="chip ${estadoClass}">${estadoTexto}</span></div>
              <div class="cita-detalles">
                📅 <strong>${cita.fecha}</strong> a las ⏰ <strong>${cita.hora}</strong><br>
                💆 ${servicioNombre} • 📞 ${cita.cliente_telefono}
              </div>
              ${cita.nota ? `<div class="cita-nota">📝 "${cita.nota}"</div>` : ''}
            </div>
            <div class="cita-actions">
              <select class="status-select" onchange="cambiarEstado(${cita.id}, this.value)">
                <option value="pendiente" ${cita.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                <option value="pagado" ${cita.estado === 'pagado' ? 'selected' : ''}>Pagado / Efectivo</option>
                <option value="bono" ${cita.estado === 'bono' ? 'selected' : ''}>Sesión Bono</option>
              </select>

              <a href="${linkWhatsApp}" target="_blank" class="btn-ws">💬 WhatsApp</a>
            </div>
          </div>
        `;
      });

      contenedor.innerHTML = html;

    } catch (err) {
      contenedor.innerHTML = `<div style="color:red; text-align:center; padding:20px; font-family:sans-serif;">Error de ejecución: ${err.message}</div>`;
    }
  }

  async function cambiarEstado(idCita, nuevoEstado) {
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { error } = await supabase
      .from('citas')
      .update({ estado: nuevoEstado })
      .eq('id', idCita);

    if (error) {
      alert("Error al actualizar estado: " + error.message);
    } else {
      cargarCitas();
    }
  }

  document.getElementById('form-cita-manual').addEventListener('submit', async function(e) {
    e.preventDefault();
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const nuevaCita = {
      cliente_nombre: document.getElementById('m_nombre').value,
      cliente_telefono: document.getElementById('m_telefono').value,
      servicio_id: parseInt(document.getElementById('m_servicio').value, 10),
      fecha: document.getElementById('m_fecha').value,
      hora: document.getElementById('m_hora').value,
      nota: document.getElementById('m_nota').value,
      estado: 'pendiente'
    };

    const { error } = await supabase.from('citas').insert([nuevaCita]);

    if (error) {
      alert("Error al guardar: " + error.message);
    } else {
      alert("¡Cita manual añadida!");
      document.getElementById('form-cita-manual').reset();
      toggleManualForm();
      cargarCitas();
    }
  });

  window.onload = cargarCitas;
</script>

</body>
</html>
